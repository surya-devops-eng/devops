# Shared memory zone for leaky-bucket rate limiting (10MB tracks ~160k IPs)
limit_req_zone $binary_remote_addr zone=req_limit_zone:10m rate=5r/s;

# Port 80 HTTP -> HTTPS Global Redirect
server {
    listen 80 default_server;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# Port 443 HTTPS Hardened Termination & Reverse Proxy
server {
    listen 443 ssl default_server;
    server_name localhost;

    # Cryptographic Stores
    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    # Modern TLS Security Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Hardening Response Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Reverse Proxy & Rate Limiting Location Block
    location / {
        limit_req zone=req_limit_zone burst=10 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
