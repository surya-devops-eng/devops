apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaled-app
  namespace: default
  labels:
    app: scaled-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scaled-app
  template:
    metadata:
      labels:
        app: scaled-app
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
