apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-data-app
  namespace: default
  labels:
    app: secure-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-app
  template:
    metadata:
      labels:
        app: secure-app
    spec:
      containers:
      - name: web-app
        image: nginx:alpine
        ports:
        - containerPort: 80
        env:
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_ENV
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-db-secret
              key: DB_PASS
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
        - name: persistent-storage
          mountPath: /usr/share/nginx/html
      volumes:
      - name: config-volume
        configMap:
          name: app-config
      - name: persistent-storage
        persistentVolumeClaim:
          claimName: app-data-pvc
